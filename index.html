function sanitizeDemoState(){

  return {...original,JoursBanque:Number.isFinite(Number(old?.JoursBanque))?Number(old.JoursBanque):original.JoursBanque};
 });
 for(const key of ['presences','examens','competencesOuvertes','declarationsAvance','ajustementsBanque','historiqueHeures','corrections']){
  if(Array.isArray(state[key]))state[key]=state[key].filter(x=>!x.NoFiche||DEMO_IDS.has(x.NoFiche));
 }
 const seen=new Set();
 state.presences=state.presences.filter(p=>{

 });

function alertSummary(records=state.presences,students=state.eleves){
 const active=new Set(students.filter(s=>s.Actif).map(s=>s.NoFiche));
 const rows=records.filter(p=>active.has(p.NoFiche));
 const absences=rows.filter(p=>p.Statut==='absent');
 const retards=rows.filter(p=>Number(p.RetardMinutes)>0);
 const incomplete=rows.filter(p=>p.Statut!=='absent'&&p.Statut!=='stage'&&(!p.HeureArrivee||!p.HeureDepart));
 const byStudent=students.filter(s=>s.Actif).map(s=>({id:s.NoFiche,name:s.Title,lab:s.Laboratoire,abs:absences.filter(p=>p.NoFiche===s.NoFiche).length,late:retards.filter(p=>p.NoFiche===s.NoFiche).length,partial:incomplete.filter(p=>p.NoFiche===s.NoFiche).length}));
 return {absences:absences.length,retards:retards.length,incomplete:incomplete.length,byStudent};
}
function weeklyCompleteness(date,lab='TOUS'){
 const days=weekDates(date);let entered=0,missing=0,off=0;
 for(const day of days){
  for(const r of dailyPresenceRows(day,lab)){
   if(!r.eligible){off++;continue}
   if(r.record)entered++;else missing++;
  }
 }
 return {entered,missing,off,days};
}

function doPointage(evt,mode='arrival'){evt?.preventDefault?.();const id=$('ptStudent').value,s=stu(id),date=$('ptDate').value,session=$('ptSession').value,time=$('ptTime').value,code=$('ptComp').value;if(!s||!date||!time||!comp(code)){toast('Champ requis ou compétence inconnue.');return false}if(s.Laboratoire!==$('ptLab').value){toast('Le laboratoire sélectionné ne correspond pas à celui de l’élève.');return false}const cle=`${id}|${date}|${session}`;let p=state.presences.find(x=>x.ClePointage===cle);const existing=p&&p[mode==='arrival'?'HeureArrivee':'HeureDepart'];if(existing&&!confirm('Ce pointage existe déjà. Remplacer cette heure?'))return false;if(!p){p={ClePointage:cle,NoFiche:id,DateJour:date,Laboratoire:s.Laboratoire,Session:session,HeureArrivee:'',HeureDepart:'',CodeCompetence:code,Statut:'present',RetardMinutes:0,DepartHatifMinutes:0};state.presences.push(p)}p.CodeCompetence=code;p.Statut='present';if(mode==='arrival'){p.HeureArrivee=time;p.RetardMinutes=roundLate(time,session);p.Statut=p.RetardMinutes>0?'retard':'present'}else{p.HeureDepart=time;p.DepartHatifMinutes=early(time,session)}if(p.HeureArrivee&&p.HeureDepart&&minutes(p.HeureDepart)<minutes(p.HeureArrivee)){if(mode==='arrival'){p.HeureArrivee=existing||'';p.RetardMinutes=p.HeureArrivee?roundLate(p.HeureArrivee,session):0}else{p.HeureDepart=existing||'';p.DepartHatifMinutes=p.HeureDepart?early(p.HeureDepart,session):0}if(!p.HeureArrivee&&!p.HeureDepart)state.presences=state.presences.filter(x=>x!==p);toast('Heure refusée : le départ ne peut pas précéder l’arrivée.');return false}filterDate=date;selected=id;save();toast(`Pointage ${mode==='arrival'?'arrivée':'départ'} sauvegardé : ${s.Title}, ${session}.`);return false}

// Calendrier V0.7 : jours admissibles par groupe, en mode DEMO uniquement.
// Les jours fériés sont exclus; les jours non saisis ne sont PAS présumés validés.
const GROUP_WEEKDAYS={LAB1:[1,2,3,4],LAB2:[1,2,3,4]}; // lundi à jeudi : hypothèse de démonstration
function isIsoDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(new Date(s+'T12:00:00').getTime())&&new Date(s+'T12:00:00').toISOString().slice(0,10)===s}
function schoolDayInfo(date,lab){
 if(!isIsoDate(date)||!GROUP_WEEKDAYS[lab])return {eligible:false,reason:'Date ou groupe invalide'};
 const dow=new Date(date+'T12:00:00').getDay();
 if(!GROUP_WEEKDAYS[lab].includes(dow))return {eligible:false,reason:'Hors horaire du groupe'};
 const holiday=state.joursFeries.find(h=>h.DateJour===date);
 if(holiday)return {eligible:false,reason:'Sans cours : '+holiday.Title};
 return {eligible:true,reason:'Cours théorique — non validé'};
}
function weekCalendarInfo(date,lab){
 if(!isIsoDate(date)||!GROUP_WEEKDAYS[lab])return [];
 const start=new Date(date+'T12:00:00');start.setDate(start.getDate()-((start.getDay()+6)%7));
 return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const day=d.toISOString().slice(0,10);return {date:day,...schoolDayInfo(day,lab)}});
}
function groupCalendarPanel(id){
 const s=stu(id);if(!s)return '';
 const days=weekCalendarInfo(filterDate||'2026-11-10',s.Laboratoire);
 const count=days.filter(d=>d.eligible).length;
 const inner=`<p>Groupe ${esc(s.Laboratoire)} · ${count} journée(s) théoriquement admissible(s) cette semaine. Horaire provisoire : lundi au jeudi.</p><div class="mini-list">${days.map(d=>`<div class="mini-row"><span>${dateFR(d.date)}</span><span class="pill ${d.eligible?'ok':'bad'}">${esc(d.reason)}</span></div>`).join('')}</div><p class="hint">Les journées en banque (${Number(s.JoursBanque)||0}) ne sont pas déduites automatiquement. Calendrier incomplet : aucune date de fin ou d’examen ne peut être garantie.</p>`;
 return panel('Calendrier LAB1 / LAB2 — simulation',inner);
}
// Projection prudente : unités de cours seulement, aucune date sans calendrier officiel.
function projectionCours(id){
 const student=stu(id);if(!student)return {rows:[],total:0};
 const rows=state.competencesOuvertes.filter(x=>x.NoFiche===id&&x.Statut==='ouverte').map(x=>{
   const c=comp(x.CodeCompetence);if(!c)return null;
   const p=prog(id,c.Code),remaining=p.done?0:Math.max(0,c.Heures-p.h);
   const am=minutes(val('amEnd'))-minutes(val('amStart'));
   const pm=minutes(val('pmEnd'))-minutes(val('pmStart'));
   const dailyHours=(am+pm)/60;
   const valid=Number.isFinite(dailyHours)&&dailyHours>0&&dailyHours<=12;
   return {code:c.Code,title:c.Title,remaining,days:valid?Math.ceil(remaining/dailyHours):null,dailyHours};
 }).filter(Boolean);
 return {rows,total:rows.reduce((a,r)=>a+r.remaining,0)};
}
function projectionPanel(id){
 const p=projectionCours(id);
 const content=p.rows.length?`<div class="mini-list">${p.rows.map(r=>`<div class="mini-row"><div><strong>${esc(r.code)} · ${esc(r.title)}</strong><div class="muted">${r.remaining.toFixed(1)} h restantes · ${r.days===null?'Horaire incomplet':r.days+' journées théoriques'} (calcul isolé)</div></div><button class="btn mini" onclick="openCompetence('${r.code}')">Voir</button></div>`).join('')}</div><p class="footnote">Total des heures restantes sur les compétences ouvertes : ${p.total.toFixed(1)} h. Les journées théoriques ne s’additionnent pas si plusieurs compétences sont suivies en parallèle. Les horaires utilisés sont ceux des réglages de démonstration, non des horaires LAB1/LAB2 certifiés.</p>`:'<p class="muted">Aucune compétence ouverte. Ouvrez une compétence pour consulter ses heures restantes.</p>';
 return panel('Prévision indicative des compétences ouvertes',content+'<div class="hint">Aucune date d’examen ou de fin calculée : calendrier scolaire complet, jours de cours propres au groupe, banque et règles de planification à valider.</div>');
}
function openSummary(id){const list=state.competencesOuvertes.filter(x=>x.NoFiche===id&&x.Statut==='ouverte');return list.map(x=>{const c=comp(x.CodeCompetence),p=prog(id,x.CodeCompetence);return `<div class="mini-row"><div><strong>${esc(x.CodeCompetence)} · ${esc(c?.Title||'')}</strong><div class="muted">${p.h.toFixed(1)} / ${c?.Heures||0} h · ${Math.max(0,(c?.Heures||0)-p.h).toFixed(1)} h restantes (indicatif)</div></div><button class="btn mini" onclick="openCompetence('${x.CodeCompetence}')">Détails</button></div>`}).join('')||'<p class="muted">Aucune compétence ouverte. Sélectionnez une compétence dans le tableau pour l’ouvrir.</p>'}

function fiche(){const s=stu(selected);if(!s)return '<p>Élève introuvable.</p>';const t=totals(selected);const cs=state.competences.map(c=>{const v=prog(selected,c.Code);const exams=state.examens.filter(e=>e.NoFiche===selected&&e.CodeCompetence===c.Code);const result=exams.at(-1)?.Resultat||'—';return `<tr><td>${c.Ordre}</td><td><button class="btn mini" onclick="openCompetence('${c.Code}')" aria-label="Détails ${esc(c.Code)}">${esc(c.Code)}</button><div class="muted">${esc(c.Title)}</div></td><td>${c.Heures} h</td><td>${v.h.toFixed(1)} h</td><td><div class="progress"><span style="width:${v.pct}%"></span></div><small>${v.pct}%</small></td><td><span class="pill ${cpill(result)}">${result}</span></td><td><button class="btn mini" onclick="openCompetence('${c.Code}')">Détails</button></td></tr>`});return `<div class="actions"><button class="btn" onclick="navigate('eleves')">← Tous les élèves</button><button class="btn primary" onclick="editStudent()">Modifier la fiche</button><button class="btn" onclick="navigate('examens')">+ Examen</button></div><div class="hero" style="margin-top:15px"><h2>${esc(s.Title)}</h2><p>${s.NoFiche} · ${s.Laboratoire} · ${esc(s.Statut)}</p></div><div class="cards"><div class="card"><small>Heures pointées</small><div class="num">${t.h.toFixed(1)} h</div></div><div class="card"><small>Compétences réussies</small><div class="num">${t.passed} / 24</div></div><div class="card"><small>Demi-journées absentes</small><div class="num">${t.abs}</div></div><div class="card"><small>Journées en banque</small><div class="num">${t.bank}</div></div></div>${panel('Cheminement par compétence',tbody(cs,['N°','Compétence','Cible','Heures pointées','Progression','Examen','Action']),'Sélectionnez une compétence pour afficher ses pointages et tentatives d’examen.')}${panel('Compétences ouvertes',openSummary(selected),'Suivi manuel des compétences actives; les heures restantes sont indicatives.')} ${competenceDetail()}${projectionPanel(selected)}${groupCalendarPanel(selected)}${panel('Date de fin prévue','<p class="warn">Calendrier scolaire officiel des années futures requis pour produire une date fiable.</p>')}`}

function updateExamNum(){const id=$('xStudent')?.value,code=$('xCode')?.value;const n=Math.max(0,...state.examens.filter(e=>e.NoFiche===id&&e.CodeCompetence===code).map(e=>Number(e.Tentative)))+1;const e=$('nextAttempt');if(e)e.textContent=`Prochaine tentative : ${n===1?'Examen':n===2?'Reprise 1':`Reprise ${n-1}`} (n° ${n})`}
function saveExam(ev){ev.preventDefault();const id=$('xStudent').value,c=$('xCode').value,date=$('xDate').value,res=$('xResult').value;if(!stu(id)||!comp(c)||!date||!['SU','EC'].includes(res)){toast('Données non valides');return false}if(state.examens.some(e=>e.NoFiche===id&&e.CodeCompetence===c&&e.Resultat==='SU')){toast('Compétence déjà réussie : nouvelle tentative refusée.');return false}const n=Math.max(0,...state.examens.filter(e=>e.NoFiche===id&&e.CodeCompetence===c).map(e=>Number(e.Tentative)))+1;const key=`${id}|${c}|${n}`;if(state.examens.some(e=>e.CleExamen===key)){toast('Examen déjà enregistré');return false}state.examens.push({CleExamen:key,NoFiche:id,CodeCompetence:c,Tentative:n,DateExamen:date,Resultat:res,JoursRepriseAjoutes:false});selected=id;save();updateExamNum();toast('Examen enregistré et fiche mise à jour');return false}
function weekDates(d){const x=new Date((d||'2026-11-09')+'T12:00:00');const dow=x.getDay(),diff=(dow+6)%7;x.setDate(x.getDate()-diff);return Array.from({length:4},(_,i)=>{const z=new Date(x);z.setDate(x.getDate()+i);return z.toISOString().slice(0,10)})}
function hfmt(minutes_){return `${Math.floor(minutes_/60)}H${String(minutes_%60).padStart(2,'0')}`}
function toscaRows(d){const cols=['DateJour','Laboratoire','NoFiche','NomComplet','HeureDebutAM','FinAM','RetardAM','DepartAM','CompetenceAM','HeureDebutPM','FinPM','RetardPM','DepartPM','CompetencePM'];return {cols,rows:state.eleves.filter(s=>s.Actif).map(s=>{const v={DateJour:d,Laboratoire:s.Laboratoire,NoFiche:s.NoFiche,NomComplet:s.Title};for(const session of ['AM','PM']){const p=state.presences.find(x=>x.NoFiche===s.NoFiche&&x.DateJour===d&&x.Session===session);const suffix=session;v['HeureDebut'+suffix]=p?.HeureArrivee||'';v['Fin'+suffix]=p?.HeureDepart||'';v['Retard'+suffix]=p?.Statut==='absent'?'ABS':!p?'':p.RetardMinutes?hfmt(p.RetardMinutes):'';v['Depart'+suffix]=p?.DepartHatifMinutes?hfmt(p.DepartHatifMinutes):'';v['Competence'+suffix]=p?.CodeCompetence||state.competences.find(c=>!prog(s.NoFiche,c.Code).done)?.Code||''}return v})}}
function downloadCsv(cols,rows,name){const q=x=>'"'+String(x??'').replaceAll('"','""')+'"';const data='\ufeff'+[cols.map(q).join(';'),...rows.map(r=>cols.map(c=>q(r[c])).join(';'))].join('\r\n');download(new Blob([data],{type:'text/csv;charset=utf-8'}),name)}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportTosca(){const d=$('rDate').value,{cols,rows}=toscaRows(d);downloadCsv(cols,rows,'Tosca_'+d+'.csv');toast('CSV 14 colonnes téléchargé (démonstration)')}
// V1.2 : rapport par groupe, contrôle de qualité et export de vérification.
let reportLab='TOUS';
function reportAudit(date,lab='TOUS'){
 if(!isIsoDate(date)||!['TOUS','LAB1','LAB2'].includes(lab))return [];
 return weekDates(date).flatMap(day=>state.eleves.filter(s=>s.Actif&&(lab==='TOUS'||s.Laboratoire===lab)).flatMap(s=>{
  if(!labSchoolDay(day,s.Laboratoire).eligible)return [];
  return ['AM','PM'].map(session=>{
   const p=state.presences.find(x=>x.NoFiche===s.NoFiche&&x.DateJour===day&&x.Session===session);
   let status='Non saisi';
   if(p){status=p.Statut==='absent'?'Absence':!p.HeureArrivee||!p.HeureDepart?'Incomplet':'Complet';}
   return {DateJour:day,Laboratoire:s.Laboratoire,NoFiche:s.NoFiche,NomComplet:s.Title,Session:session,Etat:status,Arrivee:p?.HeureArrivee||'',Depart:p?.HeureDepart||''};
  });
 }));
}
function reportAuditSummary(date,lab='TOUS'){
 const rows=reportAudit(date,lab);
 return {rows,complete:rows.filter(r=>r.Etat==='Complet').length,absent:rows.filter(r=>r.Etat==='Absence').length,incomplete:rows.filter(r=>r.Etat==='Incomplet').length,missing:rows.filter(r=>r.Etat==='Non saisi').length};
}
function exportReportAudit(){const d=$('rDate').value;if(!isIsoDate(d)){toast('Date invalide');return}const rows=reportAudit(d,reportLab);downloadCsv(['DateJour','Laboratoire','NoFiche','NomComplet','Session','Etat','Arrivee','Depart'],rows,'Controle_hebdomadaire_'+d+'_'+reportLab+'.csv');toast('Contrôle hebdomadaire exporté (démonstration)')}

function rapports(){const days=weekDates(filterDate||'2026-11-10'),audit=reportAuditSummary(filterDate||'2026-11-10',reportLab);
 const students=state.eleves.filter(s=>s.Actif&&(reportLab==='TOUS'||s.Laboratoire===reportLab));
 const r=students.map(s=>{const dates=days.map(d=>{const parts=['AM','PM'].map(a=>{if(!labSchoolDay(d,s.Laboratoire).eligible)return 'Sans cours';const p=state.presences.find(x=>x.NoFiche===s.NoFiche&&x.DateJour===d&&x.Session===a);return !p?'Non saisi':p.Statut==='absent'?'Absent':!p.HeureArrivee||!p.HeureDepart?'Incomplet':p.CodeCompetence});return `<td><div>AM : ${esc(parts[0])}</div><div class="muted">PM : ${esc(parts[1])}</div></td>`}).join('');return `<tr><td><strong>${esc(s.Title)}</strong><div class="muted">${s.NoFiche} · ${s.Laboratoire}</div></td>${dates}</tr>`});
 return `${panel('Période et exportations',`<div class="formgrid two">${field('Date du rapport','rDate',input('rDate','date',filterDate||'2026-11-10','onchange="filterDate=this.value;render()"'))}${field('Groupe','rLab',select('rLab',opts([['TOUS','Tous les groupes'],['LAB1','LAB1'],['LAB2','LAB2']],reportLab),'onchange="setReportLab(this.value)"'))}</div><div class="actions"><button class="btn primary" onclick="exportReportAudit()">Exporter le contrôle CSV</button><button class="btn" onclick="exportTosca()">Tosca CSV (tous les groupes)</button><button class="btn" onclick="window.print()">Imprimer / PDF</button></div>`, 'Les exports sont des simulations locales, pas des rapports officiels.')}${panel('Contrôle des séances admissibles',`<div class="cards"><div class="card"><small>Complètes</small><div class="num">${audit.complete}</div></div><div class="card"><small>Absences déclarées</small><div class="num">${audit.absent}</div></div><div class="card"><small>Incomplètes</small><div class="num">${audit.incomplete}</div></div><div class="card"><small>Non saisies</small><div class="num">${audit.missing}</div></div></div><p class="footnote">Seules les séances prévues au calendrier sont comptées. « Non saisie » ne signifie jamais « absence ».</p>`)}${panel('Rapport hebdomadaire',tbody(r,['Élève',...days.map(dateFR)]),`Lundi au jeudi · semaine du ${dateFR(days[0])} · ${reportLab}`)}<div class="hint">Contrôlez les pointages manquants avant tout export. Le format Tosca de démonstration doit être validé par l’établissement avant usage réel.</div>`;

// V0.8 : import de fermetures scolaires globales, atomique et limité à la démonstration.
// Format explicite DateJour;Motif, une ligne par date. Aucun renseignement d'élève.
function parseCalendarCsv(raw,existing=[]){
 const rows=[],errors=[],seen=new Set(existing.map(h=>h.DateJour));
 const lines=String(raw||'').replace(/^\uFEFF/,'').split(/\r?\n/);
 for(let i=0;i<lines.length;i++){
  const line=lines[i].trim();if(!line)continue;
  const parts=line.split(';');
  if(i===0&&line.toLowerCase().replace(/\s/g,'')==='datejour;motif')continue;
  if(parts.length!==2){errors.push(`Ligne ${i+1} : deux colonnes attendues`);continue}
  const date=parts[0].trim(),reason=parts[1].trim();
  if(!isIsoDate(date)){errors.push(`Ligne ${i+1} : date invalide`);continue}
  if(!reason||reason.length>120){errors.push(`Ligne ${i+1} : motif requis (120 caractères maximum)`);continue}
  if(seen.has(date)){errors.push(`Ligne ${i+1} : date en double ou déjà inscrite`);continue}
  seen.add(date);rows.push({DateJour:date,Title:reason});
 }
 if(!rows.length&&!errors.length)errors.push('Aucune journée à importer');
 return {rows,errors};
}
function previewCalendarImport(){
 const result=parseCalendarCsv($('calendarCsv').value,state.joursFeries);
 const e=$('calendarPreview');
 e.innerHTML=`<strong>${result.rows.length} journée(s) admissible(s), ${result.errors.length} erreur(s).</strong>`+
  (result.errors.length?`<ul>${result.errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'')+
  (result.rows.length?`<div class="mini-list">${result.rows.map(x=>`<div class="mini-row">${esc(x.DateJour)} · ${esc(x.Title)}</div>`).join('')}</div>`:'');
 $('calendarCommit').disabled=!!result.errors.length||!result.rows.length;
}
function importCalendarCsv(evt){
 evt.preventDefault();const result=parseCalendarCsv($('calendarCsv').value,state.joursFeries);
 if(result.errors.length||!result.rows.length){previewCalendarImport();toast('Import refusé : corriger toutes les lignes.');return false}
 state.joursFeries.push(...result.rows);save();toast(`${result.rows.length} journée(s) sans cours importée(s) localement.`);return false;
}
function calendrier(){const hol=[...state.joursFeries].sort((a,b)=>a.DateJour.localeCompare(b.DateJour));const school=weekDates(filterDate||'2026-11-10');return `<div class="cols"><section class="panel"><h2>Journées sans cours</h2><form class="form" onsubmit="return addHoliday(event)">${field('Date','hDate',input('hDate','date','2026-12-25','required'))}${field('Motif','hReason',input('hReason','text','Congé','required'))}<button class="btn primary">Ajouter une journée</button></form><div class="mini-list" style="margin-top:16px">${hol.map(h=>`<div class="mini-row"><span>${dateFR(h.DateJour)} · ${esc(h.Title)}</span><button class="btn mini danger" onclick="delHoliday('${h.DateJour}')">Retirer</button></div>`).join('')||'<p class="muted">Aucune journée sans cours de démonstration.</p>'}</div></section><section class="panel"><h2>Projection de fin</h2><p>Les dates futures dépendent des calendriers officiels de l’école, des congés, du rythme du groupe et des journées en banque.</p><div class="hint">Aucune date de fin inventée : il faut importer les calendriers officiels des années suivantes avant de calculer la projection.</div></section></div>${panel('Semaine consultée',`<div class="pillrow">${school.map(d=>`<span class="pill ${hol.some(h=>h.DateJour===d)?'bad':'ok'}">${dateFR(d)}</span>`).join('')}</div>`)}${groupCalendarPanel(selected)}${panel('Importer un calendrier scolaire (CSV de démonstration)',`<p class="hint">Une fermeture commune aux deux groupes par ligne. Format : <code>DateJour;Motif</code>, puis <code>2026-12-25;Congé</code>. Les lignes invalides ou en double bloquent tout l’import. Aucune connexion à SharePoint.</p><form class="form" onsubmit="return importCalendarCsv(event)"><label for="calendarCsv">Coller le calendrier scolaire</label><textarea id="calendarCsv" rows="5" oninput="previewCalendarImport()" placeholder="DateJour;Motif\n2026-12-25;Congé"></textarea><div id="calendarPreview" aria-live="polite"></div><button id="calendarCommit" class="btn primary" type="submit" disabled>Importer les journées validées</button></form>`)} `}
function addHoliday(evt){evt.preventDefault();const d=$('hDate').value;if(!isIsoDate(d)){toast('Date invalide');return false}if(state.joursFeries.some(h=>h.DateJour===d)){toast('Cette date existe déjà');return false}const reason=$('hReason').value.trim();if(!reason){toast('Motif requis');return false}state.joursFeries.push({DateJour:d,Title:reason});save();toast('Congé de démonstration ajouté');return false}
function delHoliday(d){state.joursFeries=state.joursFeries.filter(h=>h.DateJour!==d);save()}

const LAB_DAYS_DEFAULT={LAB1:[1,2,3,4],LAB2:[1,2,3,4]};
function labCalendarInit(){
 if(!state.labCalendar||typeof state.labCalendar!=='object')state.labCalendar={};
 for(const lab of ['LAB1','LAB2']){
  const z=state.labCalendar[lab];
  if(!z||!Array.isArray(z.days)||!Array.isArray(z.closures))state.labCalendar[lab]={days:[...LAB_DAYS_DEFAULT[lab]],closures:[]};
 }
}
labCalendarInit();
function validLabDays(days){return Array.isArray(days)&&days.length>=1&&days.length<=5&&new Set(days).size===days.length&&days.every(d=>Number.isInteger(d)&&d>=1&&d<=5)}
function labSchoolDay(date,lab){
 if(!isIsoDate(date)||!['LAB1','LAB2'].includes(lab))return {eligible:false,reason:'Date ou groupe invalide'};
 const day=new Date(date+'T12:00:00').getDay();
 if(!state.labCalendar[lab].days.includes(day))return {eligible:false,reason:'Hors horaire du groupe'};
 if(state.joursFeries.some(x=>x.DateJour===date))return {eligible:false,reason:'Fermeture commune'};
 const closed=state.labCalendar[lab].closures.find(x=>x.DateJour===date);
 if(closed)return {eligible:false,reason:closed.Motif};
 return {eligible:true,reason:'Cours prévu (simulation)'};
}
function labDaysSave(evt,lab){evt.preventDefault();const days=[1,2,3,4,5].filter(n=>document.getElementById('day'+lab+n)?.checked);
 if(!validLabDays(days)){toast('Choisir entre 1 et 5 jours distincts.');return false}
 state.labCalendar[lab].days=days;save();toast('Horaire de '+lab+' mis à jour');return false}
function parseLabClosures(raw,lab){
 const errors=[],items=[],seen=new Set();const lines=raw.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());
 if(lines.length&&/^DateJour\s*;\s*Motif\s*;\s*Laboratoire\s*$/i.test(lines[0].trim()))lines.shift();
 for(let i=0;i<lines.length;i++){
  const parts=lines[i].split(';').map(x=>x.trim());const [date,motif,groupe]=parts;
  if(parts.length!==3||!isIsoDate(date)||!motif||!['LAB1','LAB2'].includes(groupe))errors.push('Ligne '+(i+1)+' : format invalide');
  else if(groupe!==lab)errors.push('Ligne '+(i+1)+' : groupe différent de '+lab);
  else if(seen.has(date)||state.labCalendar[lab].closures.some(x=>x.DateJour===date))errors.push('Ligne '+(i+1)+' : date en double');
  else if(state.joursFeries.some(x=>x.DateJour===date))errors.push('Ligne '+(i+1)+' : fermeture commune déjà enregistrée');
  else {seen.add(date);items.push({DateJour:date,Motif:motif})}
 }
 return {items,errors};
}
function labPreview(){const lab=$('labCalGroup').value;const v=parseLabClosures($('labCsv').value,lab);$('labCalPreview').textContent=v.errors.length?v.errors.join(' | '):`${v.items.length} fermeture(s) valides à importer`;$('labCalCommit').disabled=!!v.errors.length||!v.items.length}
function labImport(evt){evt.preventDefault();const lab=$('labCalGroup').value;const r=parseLabClosures($('labCsv').value,lab);if(r.errors.length||!r.items.length){toast('Importation refusée : vérifier les lignes');return false}state.labCalendar[lab].closures.push(...r.items);save();toast(r.items.length+' fermeture(s) importée(s) pour '+lab);return false}

function labCalendarWeek(date,lab){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);const iso=x.toISOString().slice(0,10);return {date:iso,...labSchoolDay(iso,lab)}})}
function labCoverage(from,to,lab){if(!isIsoDate(from)||!isIsoDate(to)||from>to)return null;const a=new Date(from+'T12:00:00'),b=new Date(to+'T12:00:00');if((b-a)/86400000>366)return null;let eligible=0,excluded=0;for(let x=new Date(a);x<=b;x.setDate(x.getDate()+1)){const r=labSchoolDay(x.toISOString().slice(0,10),lab);if(r.eligible)eligible++;else excluded++}return {eligible,excluded}}

function bankSimulation(id){const s=stu(id);if(!s)return null;const bank=Number(s.JoursBanque);return Number.isFinite(bank)&&bank>=0?bank:null}
function labProjection(id,from='2026-11-16',horizon=180){const s=stu(id);if(!s||!isIsoDate(from))return {date:null,reason:'Données invalides'};
 const p=projectionCours(id);if(!p.rows.length)return {date:null,reason:'Aucune compétence ouverte'};
 if(p.rows.some(r=>r.days===null))return {date:null,reason:'Horaires incomplets'};

 for(let i=0;i<horizon;i++){const d=new Date(from+'T12:00:00');d.setDate(d.getDate()+i);const date=d.toISOString().slice(0,10);if(labSchoolDay(date,s.Laboratoire).eligible&&++count>=days)return {date,days,reason:'Estimation locale non validée'}}

}

function qualityThresholds(){

}
function qualityAlerts(){const t=qualityThresholds();return alertSummary().byStudent.map(s=>({...s,absenceAlert:s.abs>=t.absence,lateAlert:s.late>=t.late}));}
function qualityIssues(date,lab='TOUS'){
 const rows=reportAudit(date,lab),issues=[];
 const eligible=new Set(rows.map(r=>`${r.NoFiche}|${r.DateJour}|${r.Session}`));
 const seen=new Set();
 for(const p of state.presences){
  if(!p.DateJour||!weekDates(date).includes(p.DateJour)||lab!=='TOUS'&&p.Laboratoire!==lab)continue;
  const key=`${p.NoFiche}|${p.DateJour}|${p.Session}`;
  const add=(type)=>issues.push({DateJour:p.DateJour,Laboratoire:p.Laboratoire,NoFiche:p.NoFiche,Session:p.Session,Type:type});
  if(seen.has(key))add('Doublon de séance');seen.add(key);
  if(!stu(p.NoFiche))add('Élève inconnu');
  else if(stu(p.NoFiche).Laboratoire!==p.Laboratoire)add('Groupe incohérent');
  if(!eligible.has(key))add('Hors calendrier ou hors groupe');
  if(p.Statut==='absent'&&(p.HeureArrivee||p.HeureDepart))add('Absence avec heures');
  if(p.HeureArrivee&&p.HeureDepart&&minutes(p.HeureDepart)<minutes(p.HeureArrivee))add('Départ avant arrivée');
  if(p.Statut!=='absent'&&(!p.HeureArrivee||!p.HeureDepart))add('Pointage incomplet');
 }
 for(const r of rows)if(r.Etat==='Non saisi')issues.push({DateJour:r.DateJour,Laboratoire:r.Laboratoire,NoFiche:r.NoFiche,Session:r.Session,Type:'Non saisi'});
 return issues.sort((a,b)=>a.DateJour.localeCompare(b.DateJour)||a.NoFiche.localeCompare(b.NoFiche));
}
function qualityTosca(date,lab='TOUS'){

 return {issues,blocking,ready:blocking.length===0&&issues.length===0};
}

function validateToscaExport(date,lab='TOUS'){
 const issues=[];
 if(!isIsoDate(date)){issues.push({type:'date_invalide',message:'Date ISO invalide'});return {ok:false,issues};}
 const students=state.eleves.filter(s=>s.Actif&&(lab==='TOUS'||s.Laboratoire===lab));
 if(!students.length)issues.push({type:'aucun_eleve',message:'Aucun élève actif dans le groupe'});
 for(const s of students){
  if(!DEMO_IDS.has(s.NoFiche)){issues.push({type:'fiche_inconnue',message:s.NoFiche});continue;}
  if(!labSchoolDay(date,s.Laboratoire).eligible)continue;
  for(const session of ['AM','PM']){
   const key=`${s.NoFiche}|${date}|${session}`;
   const records=state.presences.filter(p=>p.ClePointage===key);
   if(records.length!==1){issues.push({type:records.length?'doublon':'non_saisi',message:key});continue;}
   const p=records[0];
   if(p.NoFiche!==s.NoFiche||p.DateJour!==date||p.Session!==session||p.Laboratoire!==s.Laboratoire)issues.push({type:'cle_incoherente',message:key});
   if(!['present','retard','absent','stage'].includes(p.Statut))issues.push({type:'statut_invalide',message:key});
   if(p.Statut==='absent'&&(p.HeureArrivee||p.HeureDepart))issues.push({type:'absence_avec_heures',message:key});
   if(['present','retard'].includes(p.Statut)&&(!p.HeureArrivee||!p.HeureDepart||minutes(p.HeureDepart)<minutes(p.HeureArrivee)))issues.push({type:'heures_incompletes',message:key});
  }
 }
 return {ok:issues.length===0,issues};
}

// V2.0 — annulation contrôlée : nouvelle écriture d'audit, jamais suppression du journal.
function correctionReversible(entry){
 if(!entry||!entry.ClePointage||!entry.Avant||!entry.Apres)return false;
 const current=state.presences.find(p=>p.ClePointage===entry.ClePointage);
 if(!current||JSON.stringify(current)!==entry.Apres)return false;
 try{
  const previous=JSON.parse(entry.Avant);
  return previous.ClePointage===entry.ClePointage&&DEMO_IDS.has(previous.NoFiche)&&isSafePointage(previous);
 }catch(_){return false;}
}
function revertCorrection(cle){
 const entry=state.corrections.find(c=>c.Cle===cle);
 if(!correctionReversible(entry)){toast('Annulation refusée : pointage modifié depuis cette correction.');return false;}
 const current=state.presences.find(p=>p.ClePointage===entry.ClePointage);
 const before=JSON.stringify(current);
 const previous=JSON.parse(entry.Avant);
 Object.assign(current,previous);
 state.corrections.push({Cle:'CORR-'+String(state.corrections.length+1).padStart(6,'0'),ClePointage:entry.ClePointage,Avant:before,Apres:JSON.stringify(current),DateCorrection:new Date().toISOString(),Origine:'annulation_demo',ReferenceAnnulee:cle});
 save();toast('Correction annulée et nouvelle trace ajoutée au journal.');return true;
}

// V2.1 — rapprochement indépendant des heures et des séances de la semaine.
// Le calcul est dérivé des pointages courants; il ne modifie jamais les heures officielles.
function weeklyReconciliation(date,lab='TOUS'){
 if(!isIsoDate(date)||!['TOUS','LAB1','LAB2'].includes(lab))return {ok:false,issues:[{type:'filtre_invalide',key:String(date)}],rows:[],totalHours:0};
 const days=new Set(weekDates(date));const issues=[],rows=[];
 const students=state.eleves.filter(s=>s.Actif&&(lab==='TOUS'||s.Laboratoire===lab));
 for(const s of students){
  let hoursTotal=0,complete=0,absent=0,missing=0;
  for(const day of days){
   const eligible=labSchoolDay(day,s.Laboratoire).eligible;
   for(const session of ['AM','PM']){
    const key=`${s.NoFiche}|${day}|${session}`;
    const matches=state.presences.filter(p=>p.NoFiche===s.NoFiche&&p.DateJour===day&&p.Session===session);
    if(!eligible){if(matches.length)issues.push({type:'hors_calendrier',key});continue;}
    if(matches.length!==1){issues.push({type:matches.length?'doublon':'non_saisi',key});missing++;continue;}
    const p=matches[0];
    if(p.ClePointage!==key||p.Laboratoire!==s.Laboratoire)issues.push({type:'identite_incoherente',key});
    if(!comp(p.CodeCompetence))issues.push({type:'competence_inconnue',key});
    if(p.Statut==='absent'){
     if(p.HeureArrivee||p.HeureDepart)issues.push({type:'absence_avec_heures',key});
     absent++;continue;
    }
    if(!['present','retard','stage'].includes(p.Statut)){issues.push({type:'statut_invalide',key});continue;}
    const start=minutes(p.HeureArrivee),end=minutes(p.HeureDepart);
    if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start||end-start>12*60){issues.push({type:'heures_invalides',key});continue;}
    const h=(end-start)/60;
    if(!Number.isFinite(h)||h<=0){issues.push({type:'duree_invalide',key});continue;}
    hoursTotal+=h;complete++;
   }
  }
  rows.push({NoFiche:s.NoFiche,NomComplet:s.Title,Laboratoire:s.Laboratoire,HeuresCalculees:Number(hoursTotal.toFixed(2)),SeancesCompletes:complete,AbsencesDeclarees:absent,NonSaisies:missing});
 }
 return {ok:issues.length===0,issues,rows,totalHours:Number(rows.reduce((n,r)=>n+r.HeuresCalculees,0).toFixed(2))};
}

// V2.2 — ventilation indépendante par compétence, sans mutation des données.
// Les pointages ambigus sont exclus des heures; les anomalies restent visibles.
function competencyReconciliation(date,lab='TOUS'){
 const weekly=weeklyReconciliation(date,lab);
 if(!weekly.rows.length)return {ok:false,issues:weekly.issues,rows:[],totalHours:0};
 const issues=[...weekly.issues],days=new Set(weekDates(date)),rows=[],byCode=new Map();
 const students=state.eleves.filter(s=>s.Actif&&(lab==='TOUS'||s.Laboratoire===lab));
 for(const student of students){
  for(const day of days){
   if(!labSchoolDay(day,student.Laboratoire).eligible)continue;
   for(const session of ['AM','PM']){
    const key=`${student.NoFiche}|${day}|${session}`;
    const matches=state.presences.filter(p=>p.NoFiche===student.NoFiche&&p.DateJour===day&&p.Session===session);
    if(matches.length!==1)continue;
    const p=matches[0];
    if(p.ClePointage!==key||p.Laboratoire!==student.Laboratoire||!['present','retard','stage'].includes(p.Statut))continue;
    if(!comp(p.CodeCompetence))continue;
    const start=minutes(p.HeureArrivee),end=minutes(p.HeureDepart);
    if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start||end-start>720)continue;
    const k=student.NoFiche+'|'+p.CodeCompetence;
    const item=byCode.get(k)||{NoFiche:student.NoFiche,NomComplet:student.Title,Laboratoire:student.Laboratoire,CodeCompetence:p.CodeCompetence,HeuresCible:Number(comp(p.CodeCompetence).Heures),MinutesCalculees:0,Seances:0};
    item.MinutesCalculees+=end-start;item.Seances++;byCode.set(k,item);
   }
  }
 }
 for(const r of byCode.values()){
  rows.push({...r,HeuresCalculees:Number((r.MinutesCalculees/60).toFixed(2)),HeuresRestantesIndicatives:Number(Math.max(0,r.HeuresCible-r.MinutesCalculees/60).toFixed(2))});
 }
 rows.sort((a,b)=>a.NoFiche.localeCompare(b.NoFiche)||a.CodeCompetence.localeCompare(b.CodeCompetence));
 const totalMinutes=rows.reduce((n,r)=>n+r.MinutesCalculees,0);
 const weeklyMinutes=weekly.rows.reduce((n,r)=>n+Math.round(r.HeuresCalculees*60),0);
 // Comparaison à la minute près, avec tolérance pour l'arrondi d'affichage hebdomadaire.
 if(Math.abs(totalMinutes-weeklyMinutes)>weekly.rows.length)issues.push({type:'ecart_ventilation',key:String(date)});
 return {ok:issues.length===0,issues,rows,totalHours:Number((totalMinutes/60).toFixed(2))};
}

 const cols=['NoFiche','NomComplet','Laboratoire','CodeCompetence','HeuresCible','HeuresCalculees','HeuresRestantesIndicatives','Seances'];

// V2.3 — cumul historique explicite, sans compter deux fois les séances.
// Une période historique est close à sa DateFin; les présences postérieures seulement
// peuvent être ajoutées au cumul. Aucune importation réelle dans cette démonstration.
function historicalCompetencyTotals(date,lab='TOUS'){
 const current=competencyReconciliation(date,lab);
 const issues=[...current.issues],byKey=new Map(),seen=new Set(),ranges=new Map();
 const historical=Array.isArray(state.historiqueHeures)?state.historiqueHeures:[];
 const allowed=new Set(state.eleves.filter(e=>e.Actif&&(lab==='TOUS'||e.Laboratoire===lab)).map(e=>e.NoFiche));
 const days=weekDates(date),end=days[days.length-1];
 for(const h of historical){
  const key=String(h.NoFiche)+'|'+String(h.CodeCompetence),ref=String(h.Cle||'');
  const minutes=Number(h.MinutesValidees),begin=h.DateDebut||'',finish=h.DateFin||'';
  if(!allowed.has(h.NoFiche)||!comp(h.CodeCompetence)||!ref||!Number.isInteger(minutes)||minutes<0||!/^\d{4}-\d{2}-\d{2}$/.test(finish)||finish>end||(begin&&(!/^\d{4}-\d{2}-\d{2}$/.test(begin)||begin>finish))){
   issues.push({type:'historique_invalide',key:ref||key});continue;
  }
  if(seen.has(ref)){issues.push({type:'historique_doublon',key:ref});continue;}
  seen.add(ref);
  const prior=ranges.get(key)||[];
  // Sans date de début, plusieurs blocs pour la même compétence sont impossibles à valider.
  if(prior.length&&(!begin||prior.some(x=>!x.begin||begin<=x.finish&&x.begin<=finish))){
   issues.push({type:'periodes_historiques_chevauchantes',key});continue;
  }
  prior.push({begin,finish});ranges.set(key,prior);
  const old=byKey.get(key)||{NoFiche:h.NoFiche,CodeCompetence:h.CodeCompetence,MinutesHistoriques:0,MinutesRecentes:0};
  old.MinutesHistoriques+=minutes;byKey.set(key,old);
 }
 for(const r of current.rows){
  const key=r.NoFiche+'|'+r.CodeCompetence,periods=ranges.get(key)||[];
  const overlap=days.some(day=>periods.some(x=>(!x.begin||day>=x.begin)&&day<=x.finish)&&state.presences.some(p=>p.NoFiche===r.NoFiche&&p.CodeCompetence===r.CodeCompetence&&p.DateJour===day));
  if(overlap){issues.push({type:'chevauchement_historique',key});continue;}
  const old=byKey.get(key)||{NoFiche:r.NoFiche,CodeCompetence:r.CodeCompetence,MinutesHistoriques:0,MinutesRecentes:0};
  old.MinutesRecentes+=r.MinutesCalculees;byKey.set(key,old);
 }
 const rows=[...byKey.values()].map(r=>({...r,HeuresTotales:Number(((r.MinutesHistoriques+r.MinutesRecentes)/60).toFixed(2))})).sort((a,b)=>a.NoFiche.localeCompare(b.NoFiche)||a.CodeCompetence.localeCompare(b.CodeCompetence));
 return {ok:issues.length===0,issues,rows,totalHours:Number((rows.reduce((n,r)=>n+r.MinutesHistoriques+r.MinutesRecentes,0)/60).toFixed(2))};
}
function historicalPanel(){
 const a=historicalCompetencyTotals(filterDate||'2026-11-10',reportLab);
 const rows=a.rows.map(r=>`<tr><td>${esc(r.NoFiche)}</td><td>${esc(r.CodeCompetence)}</td><td>${(r.MinutesHistoriques/60).toFixed(2)}</td><td>${(r.MinutesRecentes/60).toFixed(2)}</td><td>${r.HeuresTotales.toFixed(2)}</td></tr>`);
 return panel('Cumul historique contrôlé — V2.4',`<p><strong>${a.ok?'Cumul cohérent':'Cumul bloqué : '+a.issues.length+' anomalie(s)'}</strong> · ${a.totalHours.toFixed(2)} h (historique validé + semaine).</p>${tbody(rows,['Fiche','Compétence','Historique (h)','Semaine (h)','Total (h)'])}<div class="actions"><button class="btn" ${a.ok?'':'disabled'} onclick="exportHistoricalTotals()">Exporter le cumul contrôlé (CSV)</button></div><p class="footnote">Plusieurs périodes historiques sont acceptées seulement avec dates de début et de fin distinctes, sans chevauchement. Le cumul n'est pas un total DEP définitif. En cas de chevauchement, aucun export n'est autorisé.</p>`);
}
function exportHistoricalTotals(){
 const a=historicalCompetencyTotals(filterDate||'2026-11-10',reportLab);
 if(!a.ok){toast('Export bloqué : anomalies du cumul');return false;}
 downloadCsv(['NoFiche','CodeCompetence','MinutesHistoriques','MinutesRecentes','HeuresTotales'],a.rows,'Cumul_historique_controle.csv');
 toast('Cumul de démonstration exporté');return true;
}
const rapportsAvantV23=rapports;
rapports=function(){return rapportsAvantV23()+historicalPanel()};


// V2.5 — suivi du cheminement, minutes entières et cibles DEP par compétence.
// Un dépassement est un avertissement (jamais une suppression d'heures réelles).
function competencyProgress(date,lab='TOUS'){
 const a=historicalCompetencyTotals(date,lab);
 const students=state.eleves.filter(e=>e.Actif&&(lab==='TOUS'||e.Laboratoire===lab));
 const totals=new Map(a.rows.map(r=>[r.NoFiche+'|'+r.CodeCompetence,r.MinutesHistoriques+r.MinutesRecentes]));
 const rows=[];const issues=[...a.issues];
 for(const student of students){
  for(const c of state.competences){
   const code=c.Code||c.CodeCompetence;
   const target=Number(c.Heures)*60;
   if(!code||!Number.isFinite(target)||target<=0||!Number.isInteger(target)){
    issues.push({type:'cible_competence_invalide',key:String(code)});continue;
   }
   const minutes=totals.get(student.NoFiche+'|'+code)||0;
   rows.push({NoFiche:student.NoFiche,CodeCompetence:code,Intitule:c.Title||'',MinutesCible:target,MinutesCumulees:minutes,MinutesRestantes:Math.max(0,target-minutes),DepassementMinutes:Math.max(0,minutes-target),Pourcentage:Number((100*minutes/target).toFixed(1))});
  }
 }
 return {ok:issues.length===0,issues,rows,overruns:rows.filter(r=>r.DepassementMinutes>0),totalMinutes:rows.reduce((n,r)=>n+r.MinutesCumulees,0)};
}
function progressPanel(){
 const a=competencyProgress(filterDate||'2026-11-10',reportLab);
 const current=a.rows.filter(r=>r.NoFiche===selected);
 const body=current.map(r=>`<tr><td>${esc(r.CodeCompetence)}</td><td>${esc(r.Intitule)}</td><td>${(r.MinutesCumulees/60).toFixed(2)}</td><td>${(r.MinutesCible/60).toFixed(0)}</td><td>${(r.MinutesRestantes/60).toFixed(2)}</td><td>${r.Pourcentage.toFixed(1)} %${r.DepassementMinutes?' ⚠':''}</td></tr>`);
 return panel('Cheminement par compétence — V2.5',`<p><strong>${a.ok?'Calcul contrôlé':'Calcul bloqué : '+a.issues.length+' anomalie(s)'}</strong> · ${a.overruns.length} dépassement(s) à examiner. Fiche affichée : ${esc(selected)}.</p>${tbody(body,['Code','Compétence','Acquises (h)','Cible (h)','Restantes (h)','Progression'])}<div class="actions"><button class="btn" ${a.ok?'':'disabled'} onclick="exportProgress()">Exporter le cheminement (CSV)</button></div><p class="footnote">Les heures représentent le cumul historique validé et les présences de la semaine affichée, non un relevé officiel. Les dépassements restent visibles et ne sont pas effacés. Les évaluations et les validations pédagogiques ne sont pas déduites de ce calcul.</p>`);
}
function exportProgress(){
 const a=competencyProgress(filterDate||'2026-11-10',reportLab);
 if(!a.ok){toast('Export bloqué : incohérences du cheminement');return false;}
 downloadCsv(['NoFiche','CodeCompetence','Intitule','MinutesCible','MinutesCumulees','MinutesRestantes','DepassementMinutes','Pourcentage'],a.rows,'Cheminement_competences_controle.csv');
 toast('Cheminement fictif exporté');return true;
}
const rapportsAvantV25=rapports;
rapports=function(){return rapportsAvantV25()+progressPanel()};

// V2.6 — cheminement sur toutes les semaines réellement pointées jusqu'à la date choisie.
// La date de référence est inclusive; aucune semaine vide n'est transformée en absence.
function multiweekCompetencyProgress(date,lab='TOUS'){
 const cutoff=isIsoDate(date)?date:'2026-11-10';
 const weeks=[...new Set(state.presences.filter(p=>isIsoDate(p.DateJour)&&p.DateJour<=cutoff).map(p=>weekDates(p.DateJour)[0]))].sort();
 const baseline=historicalCompetencyTotals(cutoff,lab);
 const issues=[...baseline.issues.filter(i=>i.type!=='chevauchement_historique')];
 const historical=new Map();
 for(const r of baseline.rows)historical.set(r.NoFiche+'|'+r.CodeCompetence,r.MinutesHistoriques);
 const recent=new Map();let sessions=0;
 for(const week of weeks){
  const weekly=competencyReconciliation(week,lab);
  // Ne pas considérer les jours après la date de référence.
  for(const issue of weekly.issues)issues.push({...issue,semaine:week});
  for(const r of weekly.rows){
   const dates=state.presences.filter(p=>p.NoFiche===r.NoFiche&&p.CodeCompetence===r.CodeCompetence&&p.DateJour>=week&&p.DateJour<=weekDates(week)[6]);
   if(dates.some(p=>p.DateJour>cutoff)){
    // Recalcul à partir des séances admissibles, limité au jour de référence.
    const eligible=dates.filter(p=>p.DateJour<=cutoff&&['present','retard','stage'].includes(p.Statut)&&p.HeureArrivee&&p.HeureDepart&&minutes(p.HeureDepart)>minutes(p.HeureArrivee));
    const value=eligible.reduce((n,p)=>n+minutes(p.HeureDepart)-minutes(p.HeureArrivee),0);
    const k=r.NoFiche+'|'+r.CodeCompetence;recent.set(k,(recent.get(k)||0)+value);sessions+=eligible.length;
   }else{const k=r.NoFiche+'|'+r.CodeCompetence;recent.set(k,(recent.get(k)||0)+r.MinutesCalculees);sessions+=r.Seances;}
  }
 }
 const allowed=new Set(state.eleves.filter(e=>e.Actif&&(lab==='TOUS'||e.Laboratoire===lab)).map(e=>e.NoFiche));
 for(const h of state.historiqueHeures||[]){
  if(!allowed.has(h.NoFiche))continue;
  const overlapping=state.presences.some(p=>p.NoFiche===h.NoFiche&&p.CodeCompetence===h.CodeCompetence&&p.DateJour<=cutoff&&p.DateJour>=h.DateDebut&&p.DateJour<=h.DateFin);
  if(overlapping)issues.push({type:'chevauchement_historique_multiweek',key:String(h.Cle||h.NoFiche+'|'+h.CodeCompetence)});
 }
 const rows=[];
 for(const e of state.eleves.filter(e=>allowed.has(e.NoFiche))){
  for(const c of state.competences){
   const code=c.Code||c.CodeCompetence,target=Number(c.Heures)*60,k=e.NoFiche+'|'+code;
   if(!Number.isInteger(target)||target<=0){issues.push({type:'cible_invalide',key:code});continue;}
   const history=historical.get(k)||0,pointed=recent.get(k)||0,total=history+pointed;
   rows.push({NoFiche:e.NoFiche,CodeCompetence:code,Intitule:c.Title||'',MinutesCible:target,MinutesHistoriques:history,MinutesRecentes:pointed,MinutesCumulees:total,MinutesRestantes:Math.max(0,target-total),DepassementMinutes:Math.max(0,total-target),Pourcentage:Number((100*total/target).toFixed(1))});
  }
 }
 return {ok:issues.length===0,issues,rows,weeks:weeks.length,sessions,cutoff,totalMinutes:rows.reduce((n,r)=>n+r.MinutesCumulees,0)};
}
function multiweekPanel(){
 const a=multiweekCompetencyProgress(filterDate||'2026-11-10',reportLab),rows=a.rows.filter(r=>r.NoFiche===selected);
 const body=rows.map(r=>`<tr><td>${esc(r.CodeCompetence)}</td><td>${(r.MinutesHistoriques/60).toFixed(2)}</td><td>${(r.MinutesRecentes/60).toFixed(2)}</td><td>${(r.MinutesCumulees/60).toFixed(2)}</td><td>${(r.MinutesRestantes/60).toFixed(2)}</td></tr>`);
 return panel('Cheminement cumulatif — V2.6',`<p><strong>${a.ok?'Cumul vérifié localement':'Export bloqué : '+a.issues.length+' anomalie(s)'}</strong> · ${a.weeks} semaine(s) avec pointage · référence ${esc(a.cutoff)} · fiche ${esc(selected)}.</p>${tbody(body,['Compétence','Historique (h)','Pointages (h)','Cumul (h)','Reste (h)'])}<div class="actions"><button class="btn" ${a.ok?'':'disabled'} onclick="exportMultiweek()">Exporter le cumul multi-semaines (CSV)</button></div><p class="footnote">Démonstration : les semaines non saisies ne sont pas des absences. Le contrôle des présences incomplètes peut bloquer l’export. Ce calcul ne constitue pas un relevé officiel.</p>`);
}
function exportMultiweek(){
 const a=multiweekCompetencyProgress(filterDate||'2026-11-10',reportLab);
 if(!a.ok){toast('Export bloqué : vérifier les incohérences');return false;}
 downloadCsv(['NoFiche','CodeCompetence','MinutesCible','MinutesHistoriques','MinutesRecentes','MinutesCumulees','MinutesRestantes','DepassementMinutes','Pourcentage'],a.rows,'Cheminement_multisemaines_'+a.cutoff+'.csv');return true;
}
const rapportsAvantV26=rapports;
rapports=function(){return rapportsAvantV26()+multiweekPanel()};
</script></body></html>
