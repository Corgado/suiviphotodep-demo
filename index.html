<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuiviPhotoDEP — démonstration</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#071a25;background:#f4f8f8}*{box-sizing:border-box}body{margin:0}nav{border-bottom:1px solid #c9d6d9;display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding:8px}button{cursor:pointer;font-weight:700}nav button{border:0;background:transparent;padding:14px 18px;color:#52636c;border-radius:6px}button.active,.primary{background:#087f88!important;color:white!important}main{max-width:995px;margin:38px auto;padding:0 15px}h1{font-size:40px;margin:0 0 25px}h2{font-size:19px;margin:25px 0 8px}p{font-size:13px;color:#566d7b;line-height:1.5}.categories{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.categories button{background:white;border:1px solid #c5d5d9;border-radius:6px;min-height:52px;text-align:left;padding:11px;font-size:13px}.panel{background:white;border-top:3px solid #087f88;border-radius:5px;padding:18px;margin-top:15px}.panel button{border:1px solid #c8d8dc;border-radius:6px;padding:11px;background:white;color:#07323b}.panel button.primary{border:0}.line{display:flex;justify-content:space-between;border:1px solid #e0e9eb;padding:15px;font-size:13px;gap:8px}.line+.line{border-top:0}input,select{padding:11px;border:1px solid #c5d5d9;border-radius:6px;max-width:100%;font:inherit}label{display:block;font-weight:bold;font-size:13px;margin:12px 0 5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#617782;font-size:12px}.success{color:#08745b}.hidden{display:none}#notice{margin:10px 0;color:#08745b;font-size:13px}@media(max-width:650px){main{margin:22px auto}h1{font-size:34px}.categories{grid-template-columns:repeat(2,minmax(0,1fr))}nav{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto}nav button{white-space:nowrap;padding:11px} .two{grid-template-columns:1fr}}</style></head><body><nav id="nav"></nav><main><h1 id="title">Réglages</h1><div id="app"></div></main><script>
const tabs=['Prise de présence','Gestion des présences','Gestion des élèves','Gestions des examens','Rapports hebdomadaires','Réglages'];const cats=['Présence','Horaires','Calendrier','Élèves','Compétences','Rapports','Affichage','Poste élève','Sauvegarde','Corriger les présences antérieures','Historique','Mon cheminement','État du système'];let tab='Réglages',cat='État du système';const students=[{name:'Camille Fictif',id:'0000123',group:'LAB1',email:'camille@example.invalid'},{name:'Alex Exemple',id:'0000456',group:'LAB2',email:'alex@example.invalid'}];let records=JSON.parse(localStorage.getItem('demoRecords')||'[]');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const panel=s=>'<div class="panel">'+s+'</div>';const note=s=>'<p class="muted">'+s+'</p>';function render(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab=${JSON.stringify(t)};render()">${t}</button>`).join('');document.getElementById('title').textContent=tab;if(tab!=='Réglages'){document.getElementById('app').innerHTML=panel('<h2>'+esc(tab)+'</h2><p>Module de démonstration locale. Aucune donnée scolaire réelle ni connexion au serveur.</p>'+ (tab==='Gestion des élèves'?students.map(s=>`<div class="line">${s.name} · ${s.id}<span>${s.group}</span></div>`).join(''):'') );return}document.getElementById('app').innerHTML='<b style="font-size:13px">Du plus utilisé au plus occasionnel</b><p style="margin:5px 0 12px">Choisis une catégorie pour afficher seulement les réglages dont tu as besoin.</p><div class="categories">'+cats.map(c=>`<button class="${cat===c?'active':''}" onclick="cat=${JSON.stringify(c)};render()">${c}</button>`).join('')+'</div><h2>'+cat+'</h2>'+note(desc[cat]||'Paramètres de démonstration.')+'<div id="detail">'+detail()+'</div><div id="notice" aria-live="polite"></div>'}const desc={'État du système':'État actuel du serveur, de la base de données, des sauvegardes et des postes de scan.','Historique':'Consulte les corrections déjà enregistrées. Pour rectifier une erreur, fais une nouvelle correction dans l’onglet correspondant.','Corriger les présences antérieures':'Choisissez un ou plusieurs élèves et une date, puis corrigez la compétence ou le code du matin (AM) et de l’après-midi (PM).','Mon cheminement':'Accès personnel des élèves à leur dossier en lecture seule. Le courriel scolaire sert de nom d’utilisateur.','Sauvegarde':'Copie de sécurité de la démonstration, manuelle et téléchargeable.','Poste élève':'Réserve cet appareil au seul scan des élèves.'};function detail(){switch(cat){case 'État du système':return panel('<button class="primary" onclick="render()">Actualiser</button>'+[['Serveur Bun','Non utilisé (démo)'],['Base SQLite','Non utilisée (démo)'],['Stockage local','Démonstration uniquement'],['Version installée','Démo GitHub Pages'],['Poste de scan 1','Non connecté'],['Poste de scan 2','Non connecté']].map(x=>`<div class="line"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')+note('Cette page statique ne peut pas vérifier l’état du serveur original.'));case 'Historique':return panel('<input style="width:100%" placeholder="Rechercher une date, un élève ou une correction" oninput="filterHistory(this.value)"><div id="history"></div>');case 'Corriger les présences antérieures':return panel('<label>Date</label><input id="date" type="date" value="2026-11-13"><label>Élèves</label>'+students.map(s=>`<label style="font-weight:normal"><input type="checkbox" name="student" value="${s.id}"> ${s.name} · ${s.group}</label>`).join('')+'<div class="two"><div><label>Matin (AM)</label><select id="am"><option value="">Ne pas modifier</option><option>Présent</option><option>Absent</option><option>Retard</option></select></div><div><label>Après-midi (PM)</label><select id="pm"><option value="">Ne pas modifier</option><option>Présent</option><option>Absent</option><option>Retard</option></select></div></div>'+note('Tu peux corriger seulement AM, seulement PM, ou les deux. Cette démonstration conserve les modifications uniquement dans ce navigateur.')+'<button class="primary" onclick="saveCorrection()">Enregistrer</button> <button onclick="render()">Annuler</button>');case 'Sauvegarde':return panel('<h2>Sauvegarde manuelle</h2><p>Exporte les données fictives et les corrections locales en JSON.</p><button class="primary" onclick="backup()">Sauvegarder maintenant</button>')+panel('<h2>Restaurer une sauvegarde de démonstration</h2><input type="file" accept=".json,application/json" id="restore"><p><button onclick="restoreBackup()">Restaurer les données fictives</button></p>');case 'Mon cheminement':return panel('<p>Les élèves utilisent normalement leur compte scolaire. Aucun compte ni mot de passe n’est créé dans cette démonstration publique.</p>'+students.map(s=>`<div class="line">${s.name}<span>${s.group}</span></div>`).join(''));case 'Poste élève':return panel('<h2>Mode poste élève (scan seulement)</h2><p>La simulation n’active pas un véritable poste de scan et ne protège pas l’accès professeur.</p><button class="primary" onclick="msg(\'Mode scan simulé seulement.\')">Simuler le mode poste élève</button>');default:return panel('<p>Section visuelle de démonstration. Les réglages de production seront intégrés à Power Apps/SharePoint après autorisation.</p>')}}function msg(t){document.getElementById('notice').textContent=t}function saveCorrection(){const ids=[...document.querySelectorAll('input[name=student]:checked')].map(x=>x.value),am=document.getElementById('am').value,pm=document.getElementById('pm').value;if(!ids.length||(!am&&!pm)){msg('Sélectionne au moins un élève et une modification AM ou PM.');return}const date=document.getElementById('date').value;if(!date){msg('Choisis une date.');return}ids.forEach(id=>records.push({date,id,am,pm,created:new Date().toISOString()}));localStorage.setItem('demoRecords',JSON.stringify(records));msg(ids.length+' correction(s) enregistrée(s) localement.')}function filterHistory(q=''){const el=document.getElementById('history');if(!el)return;const matches=records.filter(r=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase())||students.find(s=>s.id===r.id)?.name.toLowerCase().includes(q.toLowerCase()));el.innerHTML=matches.length?matches.map(r=>`<div class="line">${esc(students.find(s=>s.id===r.id)?.name||r.id)} · ${esc(r.date)}<span>AM : ${esc(r.am||'—')} · PM : ${esc(r.pm||'—')}</span></div>`).join(''):'<p>Aucune correction enregistrée.</p>'}function backup(){const a=document.createElement('a'),blob=new Blob([JSON.stringify({type:'SuiviPhotoDEP-demo',records},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='suiviphotodep-demo-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restoreBackup(){const f=document.getElementById('restore').files[0];if(!f)return msg('Choisis un fichier JSON.');try{const x=JSON.parse(await f.text());if(x.type!=='SuiviPhotoDEP-demo'||!Array.isArray(x.records)||x.records.some(r=>!students.some(s=>s.id===r.id)))throw Error();records=x.records;localStorage.setItem('demoRecords',JSON.stringify(records));msg('Sauvegarde de démonstration restaurée.')}catch{msg('Fichier invalide ou contenant des élèves non fictifs.')}}render();filterHistory();const obs=new MutationObserver(()=>{if(cat==='Historique')filterHistory()});obs.observe(document.getElementById('app'),{childList:true});</script></body></html>
